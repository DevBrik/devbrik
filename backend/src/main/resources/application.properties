spring.application.name=devbrik-backend
server.port=8080

# Le profil "local" est actif par défaut ; en production : SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=local

# Base de données
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devbrik}
spring.datasource.username=${DB_USER:devbrik}
spring.datasource.password=${DB_PASSWORD:}

# JPA : le schéma appartient à Flyway, Hibernate ne fait que valider
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true

# Jeton (RG2 : 12 heures)
app.jwt.secret=${JWT_SECRET:}
app.jwt.duree-heures=12

# Premier administrateur (créé au démarrage s'il n'existe pas)
app.admin.pseudo=${ADMIN_PSEUDO:}
app.admin.mot-de-passe=${ADMIN_MOT_DE_PASSE:}