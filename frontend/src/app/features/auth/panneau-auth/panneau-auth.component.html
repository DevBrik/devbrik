<aside class="panneau">
  <div class="visuels" aria-hidden="true">
    @for (d of diapositives; track d.image; let i = $index) {
      <img class="visuel" [class.visible]="i === index()" [src]="d.image" alt="" width="2200" height="1600" decoding="async" />
    }
    @for (d of diapositives; track d.image; let i = $index) {
      <p class="message" [class.visible]="i === index()">{{ verbe() }} {{ d.suite }}</p>
    }
  </div>
  @if (!mouvementReduit) {
    <button type="button" class="pause" (click)="basculer()" [attr.aria-label]="enPause() ? 'Reprendre le défilement des aperçus' : 'Mettre en pause le défilement des aperçus'">
      <span class="material-icons" aria-hidden="true">{{ enPause() ? 'play_arrow' : 'pause' }}</span>
    </button>
  }
</aside>
